name: Manual SEC Research Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regression checks
        run: |
          python -m unittest discover -s tests -v
          node --test tests/weekly-research.test.mjs
          npm run lint
      - name: Scan SEC filings
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: node scripts/scan_research_weekly.mjs
      - name: Build research draft for monthly review
        run: python scripts/build_weekly_research.py --output .cache/weekly-research/research-draft.json
      - name: Upload evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-research-evidence-${{ github.run_id }}
          path: |
            .cache/weekly-research/report.md
            .cache/weekly-research/scan.json
            .cache/weekly-research/research-draft.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
