name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run after the regular US session and allow the daily feed time to settle.
    - cron: "30 22 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Generate dashboard data
        run: python scripts/retry_dashboard.py

      - name: Upload data diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: data-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/pipeline-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Node.js dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
