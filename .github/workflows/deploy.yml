name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # CR-045: first attempt 15 minutes after close, then independent retries.
    - cron: "15,30,45 16 * * 1-5"
      timezone: "America/New_York"
    - cron: "0,15,30,45 17-19 * * 1-5"
      timezone: "America/New_York"
    - cron: "30 22 * * 1-5"
      timezone: "America/New_York"
    - cron: "15 3 * * 2-6"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.preflight.outputs.needed }}
      target_date: ${{ steps.preflight.outputs.target_date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check completed session and published revision
        id: preflight
        run: python scripts/update_preflight.py

  checks:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  build:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DASHBOARD_TARGET_DATE: ${{ needs.prepare.outputs.target_date }}
      DASHBOARD_RETRY_CACHE: .cache/target-history

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore complete target-session histories
        uses: actions/cache/restore@v5
        with:
          path: .cache/target-history
          key: market-${{ github.sha }}-${{ env.DASHBOARD_TARGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-${{ github.sha }}-${{ env.DASHBOARD_TARGET_DATE }}-

      - name: Generate dashboard data
        run: python scripts/retry_dashboard.py

      - name: Save complete histories for the next attempt
        if: ${{ always() && hashFiles('.cache/target-history/*.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/target-history
          key: market-${{ github.sha }}-${{ env.DASHBOARD_TARGET_DATE }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload data diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: data-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/pipeline-diagnostics/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
