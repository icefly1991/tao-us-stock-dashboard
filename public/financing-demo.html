<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>融资／稀释风险 · 展示测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#203047;font:15px/1.65 system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px}h1{font-size:28px;margin:8px 0}p{margin:6px 0;color:#617086}.eyebrow{color:#53769b;font-size:13px;font-weight:700}.notice{background:#fff7e8;border:1px solid #edd5a6;border-radius:12px;padding:12px 16px;margin:22px 0}.toolbar{display:flex;gap:10px;align-items:center;margin:22px 0;flex-wrap:wrap}button,select{font:inherit;border:1px solid #d7e0eb;border-radius:9px;padding:8px 12px;background:white;color:#203047;cursor:pointer}button:hover{background:#f1f5fa}button:focus-visible,select:focus-visible{outline:3px solid #77a5db;outline-offset:2px}.table-wrap{overflow:auto;background:white;border:1px solid #dfe6ee;border-radius:15px}table{width:100%;border-collapse:collapse;min-width:790px}th{text-align:left;background:#f8fafc;font-size:13px;color:#64748b;padding:15px 18px}td{padding:20px 18px;border-top:1px solid #edf1f5;vertical-align:middle}th:first-child,td:first-child{position:sticky;left:0;background:white;min-width:165px}th:first-child{background:#f8fafc}strong{display:block}.sub{font-size:12px;color:#738297}.risk{display:inline-flex;align-items:center;gap:7px;font-weight:650;border:1px solid;padding:5px 11px;border-radius:9px}.risk:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}.severe{color:#b42338;background:#fff0f2;border-color:#f1c7ce}.high{color:#b45309;background:#fff7ed;border-color:#f3d5b4}.watch{color:#94700d;background:#fffbeb;border-color:#ebdfa9}.clear{color:#227356;background:#effaf5;border-color:#bfdfd0}.unknown{color:#64748b;background:#f3f5f8;border-color:#dbe1e8}.reason{font-size:12px;margin-top:5px;color:#637187}.detail td{background:#f8fafc!important;padding:22px}.detail h2{font-size:17px;margin:0 0 12px}.axes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.axis{background:white;border:1px solid #dfe6ee;border-radius:11px;padding:16px}.axis h3{font-size:13px;color:#62738a;margin:0 0 8px}.axis p{font-size:13px}.axis strong{font-size:17px}.foot{font-size:12px;margin-top:15px;color:#718096}a{color:#396c9d} [hidden]{display:none!important}@media(max-width:650px){main{padding:22px 14px}h1{font-size:23px}.axes{grid-template-columns:1fr}.detail td{padding:14px}.detail td>*{max-width:calc(100vw - 60px)}.notice{font-size:13px}}
</style>
<main>
<div class="eyebrow">TAO 美股趋势看板 / 交互测试</div>
<h1>融资／稀释风险</h1>
<p>扫一眼风险，点击看原因。已发生稀释、潜在稀释、资金压力分开呈现。</p>
<div class="notice"><b>全部为虚构演示数据。</b>下列公司、数字和等级仅测试展示效果，不对应真实股票，也不代表已完成研究。</div>
<div class="toolbar"><label for="filter">风险筛选</label><select id="filter"><option value="all">全部实例</option><option value="severe">严重</option><option value="high">高风险</option><option value="watch">关注</option><option value="clear">暂未发现突出信号</option><option value="unknown">待核实／不适用</option></select><span class="sub" id="count" aria-live="polite"></span></div>
<div class="table-wrap"><table><thead><tr><th>股票 · 演示</th><th>融资／稀释风险</th><th>近12月股数变化</th><th>关键线索</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="foot">仅有注册额度不等于已经发行；缺数据不等于低风险。等级为方案演示，尚未确立正式计算规则。</p>
<p class="foot"><a href="./#/watchlist">返回持仓股</a> · 测试页不读取或修改正式研究数据。</p>
</main>
<script>
const examples=[
{code:'DEMO-A',name:'资金紧迫型',level:'severe',label:'严重',growth:'+38.0%',reason:'迫近资金缺口＋浮动转股条款',clue:'偿债缺口仍未解决',actual:'过去一年股数增长38%',actualNote:'来自已完成股权融资；已发行股份不再计入潜在股数。',potential:'浮动价格可转债',potentialNote:'转换股数无法确定上限，不能给出固定潜在稀释率。',funding:'未来6个月存在资金缺口',fundingNote:'示例假设公司明确披露缺口，尚无已落实的足额资金。',limit:'严重标签来自资金缺口和融资条款的组合，不是仅凭亏损判断。'},
{code:'DEMO-B',name:'持续融资型',level:'high',label:'高风险',growth:'+24.0%',reason:'持续消耗资金＋大额ATM',clue:'ATM剩余额度／市值 35%',actual:'过去一年股数增长24%',actualNote:'增发18%、股权激励6%；两类原因分别记录。',potential:'ATM剩余额度 $70M',potentialNote:'示例同日市值$200M，占35%；表示额度规模，不是已发生稀释率。',funding:'历史消耗估算覆盖约9个月',fundingNote:'已核查可动用现金与短期投资；估算不代表确定生存期限。',limit:'ATM额度、公告和随后发行属于同一融资链条，不重复加分。'},
{code:'DEMO-C',name:'融资已完成型',level:'watch',label:'关注',growth:'+22.0%',reason:'明显稀释，资金压力已缓解',clue:'融资完成后现金覆盖改善',actual:'过去一年股数增长22%',actualNote:'主要来自近期已完成发行，股数与融资完成文件一致。',potential:'未发现已核实的大额余额',potentialNote:'仍需核查认股权证与后续申报，不用“ATM: No”冒充完整结论。',funding:'融资后历史消耗覆盖约26个月',fundingNote:'已把新到账现金纳入，仍需关注未来研发与债务支出。',limit:'股数增长超过20%不会自动判严重；筹资也可能缓解现金压力。'},
{code:'DEMO-D',name:'注册额度型',level:'clear',label:'暂未发现突出信号',growth:'+2.0%',reason:'仅有储架注册，未核实到发行',clue:'经营现金流为正',actual:'过去一年股数增长2%',actualNote:'示例归因于员工股权激励，已核对可比股数。',potential:'有效储架注册',potentialNote:'允许未来发行多种证券；没有证据证明当前正在出售普通股。',funding:'暂未发现近期资金缺口',fundingNote:'已核查资金、到期债务及后续披露；此结论不是安全保证。',limit:'储架注册本身不触发高风险，也不等于公司已经融资。'},
{code:'DEMO-E',name:'证据缺口型',level:'unknown',label:'待核实',growth:'—',reason:'股数不可比，ATM余额待核',clue:'不能按缺失数据判低风险',actual:'股数变化暂不可计算',actualNote:'跨期存在并股和不同股份类别，尚未统一到可比口径。',potential:'ATM余额未知',potentialNote:'只取得早期额度文件，尚未核查之后已销售及终止情况。',funding:'现金消耗资料不足',fundingNote:'缺少可比期间与偿债资料，未给出覆盖月数。',limit:'未完成的维度保持未知；不会用零填充，也不会生成低风险等级。'},
{code:'DEMO-F',name:'非公司资产型',level:'unknown',label:'不适用',growth:'—',reason:'ETF不套用公司融资模型',clue:'基金份额申赎与公司增发不同',actual:'不套用公司股数增长',actualNote:'基金份额增加不直接代表原持有人发生公司式融资稀释。',potential:'不套用ATM／可转债规则',potentialNote:'如需评估基金风险，应使用其自身结构和披露。',funding:'不套用公司现金消耗',fundingNote:'保留行情展示；这套公司融资风险模型不适用。',limit:'不适用与资料不足是两种不同状态。'}
];
const rows=document.getElementById('rows');
function render(){const items=examples.filter(x=>document.getElementById('filter').value==='all'||x.level===document.getElementById('filter').value);document.getElementById('count').textContent=`${items.length} 个演示实例`;rows.innerHTML=items.map(x=>`<tr><td><strong>${x.code}</strong><span class="sub">${x.name}</span></td><td><button class="risk ${x.level}" aria-expanded="false" aria-controls="detail-${x.code}" data-code="${x.code}">${x.label}</button><div class="reason">${x.reason}</div></td><td>${x.growth}<div class="sub">演示 · 可比时点口径</div></td><td>${x.clue}<div class="sub">点击风险标签看详情</div></td></tr><tr class="detail" id="detail-${x.code}" hidden><td colspan="4"><h2>${x.code} · 融资风险详情 <span class="sub">虚构示例</span></h2><div class="axes"><div class="axis"><h3>01 · 已发生稀释</h3><strong>${x.actual}</strong><p>${x.actualNote}</p></div><div class="axis"><h3>02 · 潜在稀释</h3><strong>${x.potential}</strong><p>${x.potentialNote}</p></div><div class="axis"><h3>03 · 融资紧迫性</h3><strong>${x.funding}</strong><p>${x.fundingNote}</p></div></div><p class="foot">判断说明：${x.limit}</p><p class="foot">正式版本此处提供：逐项原文链接、事实日期、研究日期和未核实事项。本页没有真实证据或研究日期。</p></td></tr>`).join('');}
document.getElementById('filter').addEventListener('change',render);
rows.addEventListener('click',event=>{const button=event.target.closest('button[data-code]');if(!button)return;const expanded=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!expanded));document.getElementById(`detail-${button.dataset.code}`).hidden=expanded;});
render();
</script>
</html>
